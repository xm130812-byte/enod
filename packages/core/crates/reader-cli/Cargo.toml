[package]
name = "reader-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "md-reader-core binary: daemon entrypoint"

[[bin]]
name = "md-reader-core"
path = "src/main.rs"

[dependencies]
reader-core = { path = "../reader-core" }
axum = { version = "0.8.9", features = ["json", "http1", "tokio"] }
chrono = { version = "0.4.45", features = ["serde"] }
rand = "0.9.5"
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "gzip", "brotli", "deflate", "charset"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
