<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>md-reader 概览</title>
<style>
  :root {
    --paper: #fbf8f3; --ink: #2c2621; --muted: #8b8177;
    --line: #e7ded2; --accent: #b4552d; --teal: #2f7d6e;
    --chip: #f1e9dd; --shadow: 0 12px 40px rgba(44, 38, 33, .18);
  }
  * { box-sizing: border-box; }
  html, body { width: 360px; height: 620px; margin: 0; }
  body {
    background: var(--paper); color: var(--ink); overflow: hidden;
    font: 12px/1.45 ui-sans-serif, system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    border: 1px solid var(--line); border-radius: 14px;
  }
  .wrap { height: 100%; display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px;
    border-bottom: 1px solid var(--line); -webkit-app-region: drag;
  }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  header h1 { font-size: 13px; margin: 0; font-weight: 700; letter-spacing: .02em; }
  header .mode { margin-left: auto; color: var(--muted); font-size: 10px; }
  header button {
    -webkit-app-region: no-drag; border: 0; background: transparent; color: var(--muted);
    font-size: 15px; cursor: pointer; padding: 0 2px; line-height: 1;
  }
  main { flex: 1; overflow: auto; padding: 10px 12px 6px; }
  .root { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 7px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 8px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 5px 7px; }
  .stat b { display: block; font-size: 15px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 10px; }
  .index { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 10px; margin: 0 0 8px; }
  .index .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); }
  .index.busy .pulse { animation: pulse 1s infinite; background: var(--accent); }
  @keyframes pulse { 50% { opacity: .25; } }
  .section { margin: 0 0 8px; }
  .section h2 { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: .08em; margin: 0 0 4px; text-transform: uppercase; }
  .recent { display: flex; flex-direction: column; gap: 0; }
  .recent a { display: flex; gap: 7px; align-items: baseline; color: var(--ink); text-decoration: none; padding: 3px 4px; border-radius: 6px; }
  .recent a:hover { background: var(--chip); }
  .recent .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .recent .w { color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
  .recent .s { width: 5px; height: 5px; border-radius: 50%; background: #c9beb0; flex: none; }
  .recent .s.reading { background: var(--accent); }
  .recent .s.done { background: var(--teal); }
  .empty { color: var(--muted); font-size: 11px; padding: 4px 0; }
  .work { display: flex; flex-direction: column; gap: 4px; }
  .row { display: flex; gap: 5px; }
  select, input, button.action {
    font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line);
    border-radius: 7px; padding: 4px 6px; min-width: 0;
  }
  select, input { flex: 1; }
  button.action { cursor: pointer; white-space: nowrap; }
  button.action:hover { border-color: var(--accent); color: var(--accent); }
  .quick { display: flex; gap: 5px; flex-wrap: wrap; }
  .seg { display: flex; gap: 4px; }
  .seg a {
    flex: 1; text-align: center; text-decoration: none; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 7px;
    padding: 5px 6px; font-size: 11px;
  }
  .seg a:hover { border-color: var(--accent); color: var(--accent); }
  .seg a.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .quick a, .quick button.action { font-size: 11px; text-decoration: none; color: var(--ink); background: var(--chip); border: 1px solid transparent; border-radius: 999px; padding: 4px 8px; }
  .quick a:hover, .quick button.action:hover { border-color: var(--accent); color: var(--accent); }
  footer { padding: 6px 12px 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: 9px; display: flex; gap: 8px; }
  footer .grow { flex: 1; }
  .err { color: #a33; font-size: 10px; margin-top: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="dot"></span><h1>md-reader</h1>
    <span class="mode" id="mode">打开方式 —</span>
    <button id="close" title="关闭">×</button>
  </header>
  <main>
    <div class="root" id="root">正在读取书库…</div>
    <div class="stats">
      <div class="stat"><b id="total">–</b><span>全部</span></div>
      <div class="stat"><b id="unread">–</b><span>未读</span></div>
      <div class="stat"><b id="reading">–</b><span>在读</span></div>
      <div class="stat"><b id="done">–</b><span>已读</span></div>
    </div>
    <div class="index" id="index"><span class="pulse"></span><span id="indexText">索引状态…</span></div>

    <div class="section">
      <h2>最近</h2>
      <div class="recent" id="recent"><div class="empty">加载中…</div></div>
    </div>

    <div class="section">
      <h2>打开方式</h2>
      <div class="seg">
        <a id="modeWin" href="/__shell/mode/window">应用窗口</a>
        <a id="modeChrome" href="/__shell/mode/browser">Chrome 标签页</a>
      </div>
    </div>

    <div class="section">
      <h2>视图</h2>
      <div class="seg">
        <a href="/__shell/view/simple">简洁</a>
        <a href="/__shell/view/complex">完整</a>
      </div>
    </div>

    <div class="section">
      <h2>工作区</h2>
      <div class="work">
        <div class="row"><select id="recentWs" title="最近工作区"></select><button class="action" id="switchWs">切换</button></div>
        <div class="row"><input id="wsPath" placeholder="输入工作区路径…"><button class="action" id="openPath">打开</button></div>
        <div class="err" id="err"></div>
      </div>
    </div>

    <div class="section">
      <h2>快捷</h2>
      <div class="quick">
        <a id="openMain" href="/__shell/open">打开界面</a>
        <a href="/__shell/search">搜索</a>
        <a href="/__shell/new">新建</a>
        <a href="/__shell/settings">设置</a>
        <button class="action" id="rescan">重新索引</button>
        <a href="/__shell/quit">退出</a>
      </div>
    </div>
  </main>
  <footer><span id="footer">v0.1</span><span class="grow"></span><span>单击托盘图标打开概览</span></footer>
</div>
<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => new Intl.NumberFormat('zh-CN').format(n || 0);
const origin = location.origin;
const LS = 'md-reader.recentWorkspaces';
let timer = 0, es = null;

function schedule() {
  clearTimeout(timer);
  timer = setTimeout(refresh, 250);
}

async function j(url, opts) {
  opts = opts || {};
  if (opts.method && opts.method !== 'GET') {
    opts.headers = Object.assign({ 'x-reader-client': '1' }, opts.headers || {});
  }
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}

function shortPath(p) {
  if (!p) return '—';
  const home = p.replace(/^\\\\\?\\/, '');
  return home.length > 46 ? '…' + home.slice(-45) : home;
}

function recentWorkspaces() {
  try { return JSON.parse(localStorage.getItem(LS) || '[]'); } catch { return []; }
}

function rememberWorkspace(p) {
  if (!p) return;
  const list = [p, ...recentWorkspaces().filter((x) => x !== p)].slice(0, 6);
  localStorage.setItem(LS, JSON.stringify(list));
}

async function refresh() {
  try {
    const lib = await j('/api/v1/library');
    const s = lib.stats || {};
    const by = s.byStatus || {};
    $('total').textContent = fmt(s.total);
    $('unread').textContent = fmt(by.unread);
    $('reading').textContent = fmt(by.reading);
    $('done').textContent = fmt(by.done);
    $('root').textContent = shortPath(lib.root);
    $('root').title = lib.root || '';
    rememberWorkspace(lib.root);
    renderWorkspaces(lib.root);

    const index = $('index');
    const last = s.lastScan;
    if (s.scanning) {
      index.classList.add('busy');
      $('indexText').textContent = last ? `索引中 · 已处理 ${fmt(last.total)} 篇` : '索引中…';
    } else if (last) {
      index.classList.remove('busy');
      const err = last.errors ? ` · ${last.errors} 个错误` : '';
      $('indexText').textContent = `索引完成 · ${fmt(last.total)} 篇 · ${last.durationMs || 0}ms${err}`;
    } else {
      index.classList.remove('busy');
      $('indexText').textContent = '等待首次索引';
    }

    const docs = await j('/api/v1/docs?limit=5&sort=recent');
    const list = Array.isArray(docs) ? docs : (docs.docs || []);
    const box = $('recent');
    box.innerHTML = '';
    if (!list.length) box.innerHTML = '<div class="empty">还没有文档</div>';
    for (const d of list) {
      const a = document.createElement('a');
      a.href = `/__shell/doc/${encodeURIComponent(d.id)}`;
      a.rel = 'noreferrer';
      const sdot = document.createElement('span');
      sdot.className = 's ' + (d.status || '');
      const t = document.createElement('span');
      t.className = 't'; t.textContent = d.title || d.relPath || d.id;
      const w = document.createElement('span');
      w.className = 'w'; w.textContent = d.words ? `${fmt(d.words)} 字` : '';
      a.append(sdot, t, w);
      box.append(a);
    }

    const cfg = await j('/api/v1/config');
    const browserMode = cfg.shell && cfg.shell.openMode === 'browser';
    const mode = browserMode ? 'Chrome 标签页' : '应用窗口';
    $('mode').textContent = '默认 ' + mode;
    $('modeWin').classList.toggle('active', !browserMode);
    $('modeChrome').classList.toggle('active', browserMode);
  } catch (e) {
    $('err').textContent = '读取失败：' + e.message;
  }
}

function renderWorkspaces(current) {
  const list = [current, ...recentWorkspaces().filter((x) => x !== current)];
  const sel = $('recentWs');
  sel.innerHTML = '';
  for (const p of list) {
    const o = document.createElement('option');
    o.value = p; o.textContent = shortPath(p);
    o.title = p;
    sel.append(o);
  }
  $('wsPath').placeholder = shortPath(current) || '输入工作区路径…';
}

async function mountWorkspace(path) {
  if (!path) return;
  $('err').textContent = '';
  try {
    await j('/api/v1/library/open', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ path }),
    });
    rememberWorkspace(path);
    await refresh();
  } catch (e) {
    $('err').textContent = '切换失败：' + e.message;
  }
}

$('switchWs').addEventListener('click', () => mountWorkspace($('recentWs').value));
$('openPath').addEventListener('click', () => mountWorkspace($('wsPath').value.trim()));
$('rescan').addEventListener('click', async () => {
  try { await j('/api/v1/library/rescan', { method: 'POST' }); schedule(); }
  catch (e) { $('err').textContent = '重新索引失败：' + e.message; }
});
$('close').addEventListener('click', () => window.close());

function connect() {
  if (es) es.close();
  try {
    es = new EventSource('/api/v1/events');
    es.onmessage = schedule;
    es.onerror = () => { es.close(); setTimeout(connect, 3000); };
  } catch { /* 轮询兜底 */ }
}

refresh();
connect();
setInterval(refresh, 5000);
</script>
</body>
</html>
