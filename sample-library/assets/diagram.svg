<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="浏览器、守护进程与书库的关系">
  <defs>
    <style>
      .box { fill: #fff; stroke: #c9c2b6; stroke-width: 1.5; rx: 10; }
      .label { font: 14px ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #2b2724; }
      .muted { font: 12px ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #7a7267; }
      .line { stroke: #a89f90; stroke-width: 1.5; fill: none; }
      .dot { fill: #b4552d; }
    </style>
  </defs>
  <rect width="720" height="300" fill="#faf7f0"/>
  <rect class="box" x="40" y="110" width="150" height="80" rx="10"/>
  <text class="label" x="115" y="145" text-anchor="middle">Chrome</text>
  <text class="muted" x="115" y="168" text-anchor="middle">web UI</text>

  <rect class="box" x="285" y="90" width="190" height="120" rx="10"/>
  <text class="label" x="380" y="127" text-anchor="middle">Node 守护进程</text>
  <text class="muted" x="380" y="150" text-anchor="middle">索引 · 监听 · 写回</text>
  <text class="muted" x="380" y="172" text-anchor="middle">127.0.0.1:随机端口</text>

  <rect class="box" x="570" y="110" width="110" height="80" rx="10"/>
  <text class="label" x="625" y="145" text-anchor="middle">书库</text>
  <text class="muted" x="625" y="168" text-anchor="middle">.md + assets</text>

  <path class="line" d="M190 150 H285" marker-end="url(#arrow)"/>
  <path class="line" d="M475 150 H570" marker-end="url(#arrow)"/>
  <text class="muted" x="237" y="140" text-anchor="middle">HTTP / SSE</text>
  <text class="muted" x="522" y="140" text-anchor="middle">fs.watch</text>

  <circle class="dot" cx="220" cy="150" r="3"/>
  <circle class="dot" cx="500" cy="150" r="3"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a89f90"/>
    </marker>
  </defs>
</svg>
