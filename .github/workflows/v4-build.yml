name: v4 build

on:
  workflow_dispatch:
  push:
    tags: ['v4*']

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64 (NSIS, per-user)
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            label: Linux x64 (deb)
            target: x86_64-unknown-linux-gnu
            bundles: deb
          - os: macos-14
            label: macOS arm64 (dmg)
            target: aarch64-apple-darwin
            bundles: dmg

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux system deps (Tauri shell only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Web dependencies + build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Rust core (release)
        run: cargo build --release -p reader-cli --manifest-path packages/core/Cargo.toml

      - name: Stage sidecar
        run: node scripts/prepare-sidecar.mjs ${{ matrix.target }}

      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Bundle
        working-directory: packages/shell/src-tauri
        run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: md-reader-${{ matrix.target }}
          path: |
            packages/shell/src-tauri/target/**/release/bundle/nsis/*.exe
            packages/shell/src-tauri/target/**/release/bundle/dmg/*.dmg
            packages/shell/src-tauri/target/**/release/bundle/appimage/*.AppImage
            packages/shell/src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: warn
          retention-days: 14
